{% extends 'layout.html' %}
{% block content %}
  <h1>Login</h1>
  {% include 'partials/flash_messages.html' %}
  <form method="post" class="auth-form" novalidate>
    {{ form.hidden_tag() }}
    <label for="email">{{ form.email.label }}</label>
    {{ form.email(class_='input', id='email') }}

    <label for="password">{{ form.password.label }}</label>
    <div class="password-row">
      {{ form.password(class_='input', id='password') }}
      <button type="button" class="pw-toggle" data-target="password">Show</button>
    </div>

    <div class="row-between">
      <label class="remember">{{ form.remember() }} {{ form.remember.label }}</label>
      <a href="#" class="small-link">Forgot?</a>
    </div>

    <button type="submit" class="btn primary" id="login-btn">{{ form.submit.label.text }}</button>

    <p class="muted">Don't have an account? <a href="/auth/signup">Sign up</a></p>
  </form>
{% endblock %}
