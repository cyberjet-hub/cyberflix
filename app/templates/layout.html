<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cyberflix</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-left">
      <div class="logo"><a href="/"> <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="Cyberflix logo" style="height:36px; vertical-align:middle"> </a></div>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/catalogue">Movies</a>
        <a href="/my-list">My List</a>
      </div>
    </div>
    <div class="nav-account">
      {% if current_user.is_authenticated %}
        <span class="user-name">Hello, {{ current_user.full_name.split(' ')[0] }}</span>
        <a href="/auth/logout">Logout</a>
      {% else %}
        <a href="/auth/login">Log in</a>
      {% endif %}
    </div>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/js/main.js"></script>
</body>
</html>
