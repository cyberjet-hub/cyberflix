<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cyberflix</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="nav">
    <div class="nav-left">
      <div class="logo">
        <a href="{{ url_for('main.index') }}">
          <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="Cyberflix logo" class="logo-image">
        </a>
      </div>

      <div class="nav-links">
        <a href="{{ url_for('main.index') }}">Home</a>
        <a href="{{ url_for('main.catalogue') }}">Movies</a>
        <a href="{{ url_for('main.my_list') }}">My List</a>
      </div>
    </div>

    <div class="nav-account">
      {% if current_user.is_authenticated %}
        <span class="user-name">Hello, {{ current_user.full_name.split(' ')[0] }}</span>
        <a href="{{ url_for('auth.logout') }}">Logout</a>
      {% else %}
        <a href="{{ url_for('auth.login') }}">Log in</a>
      {% endif %}
    </div>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
